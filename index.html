<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>HARRY'S | Personel Paneli</title>

<style>

:root{
    --bg:#070707;
    --panel:#111;
    --panel2:#171717;
    --gold:#d6b36a;
    --gold2:#f0d79c;
    --text:#f4f1ea;
    --muted:#8f8b84;
    --green:#67c58a;
    --red:#d95d5d;
    --orange:#df9a4e;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(214,179,106,.13),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================
   LOGIN
========================================= */

.login-screen{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;

    padding:30px 25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border:
        1px solid rgba(214,179,106,.18);

    border-radius:22px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.5);
}

.login-logo{
    width:150px;
    max-height:70px;

    display:block;

    object-fit:contain;

    margin:0 auto 22px;
}

.login-title{
    text-align:center;

    font-size:22px;

    font-weight:900;

    letter-spacing:.3px;
}

.login-subtitle{
    text-align:center;

    margin-top:6px;

    color:var(--muted);

    font-size:11px;
}

.login-form{
    margin-top:25px;
}

.login-label{
    display:block;

    margin-bottom:7px;

    color:var(--muted);

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.login-input{
    width:100%;

    border:
        1px solid rgba(255,255,255,.09);

    background:#0d0d0d;

    color:var(--text);

    border-radius:11px;

    padding:13px 12px;

    outline:none;

    margin-bottom:15px;
}

.login-input:focus{
    border-color:
        rgba(214,179,106,.5);
}

.login-button{
    width:100%;

    border:0;

    background:var(--gold);

    color:#111;

    border-radius:11px;

    padding:13px;

    font-size:12px;

    font-weight:900;

    margin-top:4px;
}

.login-button:hover{
    background:var(--gold2);
}

.login-button:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.login-error{
    margin-top:14px;

    padding:11px 12px;

    background:
        rgba(217,93,93,.07);

    border:
        1px solid rgba(217,93,93,.2);

    color:#e6a0a0;

    border-radius:10px;

    font-size:11px;

    line-height:1.5;
}


/* =========================================
   APP
========================================= */

.app{
    max-width:1100px;
    margin:auto;
    padding:20px 15px 50px;
}


/* =========================================
   HEADER
========================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 0 22px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:110px;
    max-height:55px;
    object-fit:contain;
}

.title{
    font-size:18px;
    font-weight:800;
}

.subtitle{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.connection{
    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);
    font-size:11px;
}

.connection-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px rgba(103,197,138,.7);
}

.logout-button{
    border:
        1px solid rgba(255,255,255,.09);

    background:#151515;

    color:#aaa;

    border-radius:9px;

    padding:8px 11px;

    font-size:10px;

    font-weight:800;
}

.logout-button:hover{
    border-color:
        rgba(217,93,93,.35);

    color:#e6a0a0;
}


/* =========================================
   STATS
========================================= */

.stats{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin:18px 0;
}

.stat{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:15px;

    padding:15px;
}

.stat-label{
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    margin-top:6px;

    font-size:24px;
    font-weight:800;

    color:var(--gold2);
}


/* =========================================
   SECTION
========================================= */

.section{
    margin-top:25px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;
}

.section-title{
    font-size:16px;
    font-weight:800;
}

.section-count{
    color:var(--muted);
    font-size:11px;
}


/* =========================================
   WAITER CALLS
========================================= */

.waiter-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.waiter-card{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:16px;

    background:
        linear-gradient(
            135deg,
            rgba(214,179,106,.10),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(214,179,106,.25);

    border-radius:16px;
}

.waiter-info{
    display:flex;
    align-items:center;
    gap:13px;
}

.waiter-icon{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:rgba(214,179,106,.12);

    color:var(--gold2);

    font-size:21px;
}

.table-number{
    font-size:17px;
    font-weight:800;
}

.request-time{
    margin-top:4px;

    color:var(--muted);

    font-size:11px;
}

.handle-button{
    border:0;

    background:var(--gold);

    color:#111;

    border-radius:10px;

    padding:10px 14px;

    font-size:12px;

    font-weight:800;
}

.handle-button:hover{
    background:var(--gold2);
}


/* =========================================
   ORDERS
========================================= */

.orders{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;
}

.order-card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:17px;

    padding:15px;
}

.order-card.new{
    border-color:
        rgba(214,179,106,.35);

    box-shadow:
        0 0 25px rgba(214,179,106,.05);
}

.order-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    margin-bottom:13px;
}

.order-table{
    font-size:18px;
    font-weight:900;
}

.order-time{
    margin-top:4px;

    color:var(--muted);

    font-size:10px;
}

.status{
    padding:6px 9px;

    border-radius:8px;

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;
}

.status-pending{
    background:rgba(214,179,106,.12);
    color:var(--gold2);
}

.status-preparing{
    background:rgba(223,154,78,.12);
    color:var(--orange);
}

.status-ready{
    background:rgba(103,197,138,.12);
    color:var(--green);
}

.status-delivered{
    background:rgba(255,255,255,.07);
    color:#aaa;
}

.status-cancelled{
    background:rgba(217,93,93,.12);
    color:var(--red);
}

.order-items{
    border-top:
        1px solid rgba(255,255,255,.06);

    padding-top:10px;
}

.order-item{
    display:flex;
    justify-content:space-between;

    gap:10px;

    padding:6px 0;

    font-size:12px;
}

.order-item-name{
    color:#ddd;
}

.order-item-qty{
    color:var(--gold2);

    font-weight:800;

    white-space:nowrap;
}

.order-bottom{
    margin-top:13px;

    padding-top:12px;

    border-top:
        1px solid rgba(255,255,255,.06);

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.payment{
    color:var(--muted);

    font-size:10px;
}

.total{
    color:var(--gold2);

    font-size:16px;

    font-weight:900;
}

.order-actions{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;

    margin-top:12px;
}

.action-button{
    border:
        1px solid rgba(255,255,255,.08);

    background:#161616;

    color:#bbb;

    padding:9px 7px;

    border-radius:9px;

    font-size:10px;

    font-weight:700;
}

.action-button:hover{
    border-color:
        rgba(214,179,106,.35);

    color:var(--gold2);
}


/* =========================================
   EMPTY
========================================= */

.empty{
    padding:30px;

    text-align:center;

    color:var(--muted);

    background:#101010;

    border:
        1px solid rgba(255,255,255,.05);

    border-radius:15px;

    font-size:12px;
}


/* =========================================
   ERROR
========================================= */

.error{
    padding:20px;

    color:#e6a0a0;

    background:rgba(217,93,93,.05);

    border:
        1px solid rgba(217,93,93,.2);

    border-radius:14px;

    font-size:12px;
}


/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#f1eee7;

    color:#111;

    padding:12px 17px;

    border-radius:11px;

    font-size:12px;

    font-weight:800;

    transition:.25s;

    z-index:999;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .header{
        align-items:flex-start;
    }

    .header-right{
        gap:8px;
    }

    .connection{
        display:none;
    }

    .logout-button{
        padding:7px 9px;
    }

    .stats{
        grid-template-columns:
            repeat(3,1fr);
    }

    .stat{
        padding:12px;
    }

    .stat-value{
        font-size:20px;
    }

    .orders{
        grid-template-columns:1fr;
    }

    .waiter-card{
        align-items:flex-start;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOGIN SCREEN
========================================================= -->

<div
    class="login-screen"
    id="loginScreen"
>

    <div class="login-box">

        <img
            src="harrys-logo.png"
            class="login-logo"
            alt="HARRY'S"
            onerror="this.style.display='none';"
        >

        <div class="login-title">
            Personel Girişi
        </div>

        <div class="login-subtitle">
            Night Order • HARRY'S
        </div>


        <form
            class="login-form"
            id="loginForm"
        >

            <label
                class="login-label"
                for="email"
            >
                E-posta
            </label>

            <input
                id="email"
                class="login-input"
                type="email"
                autocomplete="username"
                placeholder="personel@ornek.com"
                required
            >


            <label
                class="login-label"
                for="password"
            >
                Şifre
            </label>

            <input
                id="password"
                class="login-input"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
            >


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                GİRİŞ YAP
            </button>


            <div
                class="login-error hidden"
                id="loginError"
            ></div>

        </form>

    </div>

</div>


<!-- =========================================================
     STAFF APP
========================================================= -->

<div
    class="app hidden"
    id="app"
>


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <img
                src="harrys-logo.png"
                class="logo"
                alt="HARRY'S"
                onerror="this.style.display='none';"
            >

            <div>

                <div class="title">
                    Personel Paneli
                </div>

                <div class="subtitle">
                    Night Order
                </div>

            </div>

        </div>


        <div class="header-right">

            <div class="connection">

                <span class="connection-dot"></span>

                Sistem aktif

            </div>


            <button
                type="button"
                class="logout-button"
                id="logoutButton"
            >
                ÇIKIŞ
            </button>

        </div>

    </header>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-label">
                Yeni Sipariş
            </div>

            <div
                class="stat-value"
                id="newOrderCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Hazırlanıyor
            </div>

            <div
                class="stat-value"
                id="preparingCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Garson Çağrısı
            </div>

            <div
                class="stat-value"
                id="waiterCount"
            >
                0
            </div>

        </div>

    </section>


    <!-- WAITER REQUESTS -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                🔔 Garson Çağrıları
            </div>

            <div
                class="section-count"
                id="waiterSectionCount"
            >
                0 çağrı
            </div>

        </div>


        <div
            class="waiter-list"
            id="waiterList"
        >

            <div class="empty">
                Aktif garson çağrısı yok.
            </div>

        </div>

    </section>


    <!-- ORDERS -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                🛎 Siparişler
            </div>

            <div
                class="section-count"
                id="orderSectionCount"
            >
                0 sipariş
            </div>

        </div>


        <div
            class="orders"
            id="orders"
        >

            <div class="empty">
                Siparişler yükleniyor...
            </div>

        </div>

    </section>


</div>


<div
    class="toast"
    id="toast"
></div>


<!-- =========================================================
     SUPABASE JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qkevbwcwsbgftvgxgasy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_l39-lwrk--GgVkKDFEoPIA_1pmKKPTu";

const {
    createClient
} = window.supabase;

const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STATE
========================================================= */

let orders = [];

let orderItems = [];

let waiterRequests = [];

let refreshTimer = null;


/* =========================================================
   DOM
========================================================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const app =
    document.getElementById(
        "app"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =========================================================
   HELPERS
========================================================= */

function formatPrice(value){

    return Number(value || 0)
        .toLocaleString(
            "tr-TR",
            {
                style:"currency",
                currency:"TRY"
            }
        );

}


function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


function showLoginError(message){

    loginError.textContent =
        message;

    loginError.classList.remove(
        "hidden"
    );

}


function hideLoginError(){

    loginError.textContent =
        "";

    loginError.classList.add(
        "hidden"
    );

}


/* =========================================================
   AUTH UI
========================================================= */

function showApp(){

    loginScreen.classList.add(
        "hidden"
    );

    app.classList.remove(
        "hidden"
    );

}


function showLogin(){

    app.classList.add(
        "hidden"
    );

    loginScreen.classList.remove(
        "hidden"
    );

}


function stopRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

        refreshTimer =
            null;

    }

}


function startRefresh(){

    stopRefresh();

    refreshTimer =
        setInterval(
            async () => {

                const {
                    data
                } =
                    await db.auth
                        .getSession();


                if(
                    !data ||
                    !data.session
                ){

                    stopRefresh();

                    showLogin();

                    return;

                }


                try{

                    await Promise.all([
                        loadOrders(),
                        loadWaiterRequests()
                    ]);

                }catch(error){

                    console.error(
                        "Otomatik güncelleme hatası:",
                        error
                    );

                }

            },
            5000
        );

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        hideLoginError();

        loginButton.disabled =
            true;

        loginButton.textContent =
            "GİRİŞ YAPILIYOR...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        try{

            const {
                data,
                error
            } =
                await db.auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "Giriş yapılamadı."
                );

            }


            showApp();

            showToast(
                "Personel girişi başarılı."
            );


            await startApp();


        }catch(error){

            console.error(
                "GİRİŞ HATASI:",
                error
            );


            showLoginError(
                error.message ||
                "E-posta veya şifre hatalı."
            );


        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "GİRİŞ YAP";

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async () => {

        stopRefresh();


        const {
            error
        } =
            await db.auth
                .signOut();


        if(error){

            console.error(
                "ÇIKIŞ HATASI:",
                error
            );

            showToast(
                "Çıkış yapılamadı."
            );

            return;

        }


        orders = [];

        orderItems = [];

        waiterRequests = [];


        showLogin();


        document.getElementById(
            "password"
        ).value = "";


        showToast(
            "Oturum kapatıldı."
        );

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        console.log(
            "AUTH:",
            event
        );


        if(session){

            showApp();

        }else{

            stopRefresh();

            showLogin();

        }

    }
);


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    const {
        data,
        error
    } =
        await db
            .from("orders")
            .select(
                "id,table_id,status,payment_method,note,total,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(100);


    if(error){

        throw error;

    }


    orders =
        Array.isArray(data)
            ? data
            : [];


    await loadOrderItems();

}


/* =========================================================
   LOAD ORDER ITEMS
========================================================= */

async function loadOrderItems(){

    if(!orders.length){

        orderItems = [];

        renderOrders();

        return;

    }


    const ids =
        orders.map(
            order =>
                order.id
        );


    const {
        data,
        error
    } =
        await db
            .from("order_items")
            .select(
                "order_id,product_name,quantity,unit_price,total"
            )
            .in(
                "order_id",
                ids
            );


    if(error){

        throw error;

    }


    orderItems =
        Array.isArray(data)
            ? data
            : [];


    renderOrders();

}


/* =========================================================
   LOAD WAITER REQUESTS
========================================================= */

async function loadWaiterRequests(){

    const {
        data,
        error
    } =
        await db
            .from("service_requests")
            .select(
                "id,table_id,request_type,status,created_at"
            )
            .eq(
                "status",
                "pending"
            )
            .eq(
                "request_type",
                "waiter"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        throw error;

    }


    waiterRequests =
        Array.isArray(data)
            ? data
            : [];


    renderWaiterRequests();

}


/* =========================================================
   RENDER WAITER REQUESTS
========================================================= */

function renderWaiterRequests(){

    const list =
        document.getElementById(
            "waiterList"
        );


    const count =
        waiterRequests.length;


    document.getElementById(
        "waiterCount"
    ).textContent =
        count;


    document.getElementById(
        "waiterSectionCount"
    ).textContent =
        `${count} çağrı`;


    list.innerHTML = "";


    if(!count){

        list.innerHTML =
            `
            <div class="empty">
                Aktif garson çağrısı yok.
            </div>
            `;

        return;

    }


    waiterRequests.forEach(
        request => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "waiter-card";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "waiter-info";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "waiter-icon";

            icon.textContent =
                "♟";


            const text =
                document.createElement(
                    "div"
                );


            const table =
                document.createElement(
                    "div"
                );

            table.className =
                "table-number";

            table.textContent =
                `Masa ${request.table_id}`;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "request-time";

            time.textContent =
                `${formatTime(request.created_at)} • Garson bekleniyor`;


            text.appendChild(table);

            text.appendChild(time);


            info.appendChild(icon);

            info.appendChild(text);


            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "handle-button";

            button.textContent =
                "GÖRDÜM";


            button.addEventListener(
                "click",
                () => {

                    handleWaiterRequest(
                        request.id
                    );

                }
            );


            card.appendChild(info);

            card.appendChild(button);


            list.appendChild(card);

        }
    );

}


/* =========================================================
   HANDLE WAITER REQUEST
   SECURE RPC
========================================================= */

async function handleWaiterRequest(id){

    try{

        const {
            data,
            error
        } =
            await db
                .rpc(
                    "handle_waiter_request",
                    {
                        request_id:id
                    }
                );


        if(error){

            throw error;

        }


        console.log(
            "Garson çağrısı:",
            data
        );


        showToast(
            "Garson çağrısı kapatıldı."
        );


        await loadWaiterRequests();


    }catch(error){

        console.error(
            "GARSON ÇAĞRISI HATASI:",
            error
        );


        showToast(
            "Çağrı kapatılamadı."
        );

    }

}


/* =========================================================
   ORDER STATUS
========================================================= */

function statusText(status){

    switch(status){

        case "pending":
            return "Yeni";

        case "preparing":
            return "Hazırlanıyor";

        case "ready":
            return "Hazır";

        case "delivered":
            return "Teslim Edildi";

        case "completed":
            return "Tamamlandı";

        case "cancelled":
            return "İptal";

        default:
            return status || "Bilinmiyor";

    }

}


function statusClass(status){

    switch(status){

        case "pending":
            return "status-pending";

        case "preparing":
            return "status-preparing";

        case "ready":
            return "status-ready";

        case "delivered":
            return "status-delivered";

        case "cancelled":
            return "status-cancelled";

        default:
            return "status-pending";

    }

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(){

    const container =
        document.getElementById(
            "orders"
        );


    container.innerHTML = "";


    const newCount =
        orders.filter(
            order =>
                order.status === "pending"
        ).length;


    const preparingCount =
        orders.filter(
            order =>
                order.status === "preparing"
        ).length;


    document.getElementById(
        "newOrderCount"
    ).textContent =
        newCount;


    document.getElementById(
        "preparingCount"
    ).textContent =
        preparingCount;


    document.getElementById(
        "orderSectionCount"
    ).textContent =
        `${orders.length} sipariş`;


    if(!orders.length){

        container.innerHTML =
            `
            <div class="empty">
                Henüz sipariş yok.
            </div>
            `;

        return;

    }


    orders.forEach(
        order => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            if(
                order.status === "pending"
            ){

                card.classList.add(
                    "new"
                );

            }


            /* TOP */

            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "order-top";


            const tableBox =
                document.createElement(
                    "div"
                );


            const table =
                document.createElement(
                    "div"
                );

            table.className =
                "order-table";

            table.textContent =
                `Masa ${order.table_id}`;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "order-time";

            time.textContent =
                formatTime(
                    order.created_at
                );


            tableBox.appendChild(
                table
            );

            tableBox.appendChild(
                time
            );


            const status =
                document.createElement(
                    "div"
                );

            status.className =
                `status ${statusClass(order.status)}`;

            status.textContent =
                statusText(
                    order.status
                );


            top.appendChild(
                tableBox
            );

            top.appendChild(
                status
            );


            /* ITEMS */

            const itemsBox =
                document.createElement(
                    "div"
                );

            itemsBox.className =
                "order-items";


            const items =
                orderItems.filter(
                    item =>
                        String(
                            item.order_id
                        ) ===
                        String(
                            order.id
                        )
                );


            if(!items.length){

                const emptyItem =
                    document.createElement(
                        "div"
                    );

                emptyItem.className =
                    "order-item";

                emptyItem.textContent =
                    "Ürün bilgisi bulunamadı.";


                itemsBox.appendChild(
                    emptyItem
                );

            }else{

                items.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.className =
                            "order-item";


                        const name =
                            document.createElement(
                                "span"
                            );

                        name.className =
                            "order-item-name";

                        name.textContent =
                            item.product_name;


                        const qty =
                            document.createElement(
                                "span"
                            );

                        qty.className =
                            "order-item-qty";

                        qty.textContent =
                            `${item.quantity} × ${formatPrice(item.unit_price)}`;


                        row.appendChild(
                            name
                        );

                        row.appendChild(
                            qty
                        );


                        itemsBox.appendChild(
                            row
                        );

                    }
                );

            }


            /* BOTTOM */

            const bottom =
                document.createElement(
                    "div"
                );

            bottom.className =
                "order-bottom";


            const payment =
                document.createElement(
                    "div"
                );

            payment.className =
                "payment";

            payment.textContent =
                `Ödeme: ${order.payment_method || "-"}`;


            const total =
                document.createElement(
                    "div"
                );

            total.className =
                "total";

            total.textContent =
                formatPrice(
                    order.total
                );


            bottom.appendChild(
                payment
            );

            bottom.appendChild(
                total
            );


            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "order-actions";


            if(
                order.status === "pending"
            ){

                actions.appendChild(
                    createActionButton(
                        "Hazırlanıyor",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "preparing"
                            )
                    )
                );

            }


            if(
                order.status === "preparing"
            ){

                actions.appendChild(
                    createActionButton(
                        "Hazır",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "ready"
                            )
                    )
                );

            }


            if(
                order.status === "ready"
            ){

                actions.appendChild(
                    createActionButton(
                        "Teslim Edildi",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "delivered"
                            )
                    )
                );

            }


            if(
                order.status !== "delivered" &&
                order.status !== "cancelled" &&
                order.status !== "completed"
            ){

                actions.appendChild(
                    createActionButton(
                        "İptal",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "cancelled"
                            )
                    )
                );

            }


            card.appendChild(
                top
            );

            card.appendChild(
                itemsBox
            );

            card.appendChild(
                bottom
            );

            card.appendChild(
                actions
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ACTION BUTTON
========================================================= */

function createActionButton(
    text,
    action
){

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "action-button";


    button.textContent =
        text;


    button.addEventListener(
        "click",
        action
    );


    return button;

}


/* =========================================================
   UPDATE ORDER STATUS
   AUTHENTICATED REQUEST
========================================================= */

async function updateOrderStatus(
    orderId,
    status
){

    try{

        const {
            error
        } =
            await db
                .from("orders")
                .update({
                    status:status
                })
                .eq(
                    "id",
                    orderId
                );


        if(error){

            throw error;

        }


        showToast(
            `Sipariş: ${statusText(status)}`
        );


        await loadOrders();


    }catch(error){

        console.error(
            "SİPARİŞ DURUMU HATASI:",
            error
        );


        showToast(
            "Sipariş durumu değiştirilemedi."
        );

    }

}


/* =========================================================
   START APP
========================================================= */

async function startApp(){

    try{

        const {
            data,
            error
        } =
            await db.auth
                .getSession();


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.session
        ){

            showLogin();

            return;

        }


        /*
         * İlk veri yükleme
         */

        await Promise.all([
            loadOrders(),
            loadWaiterRequests()
        ]);


        startRefresh();


        console.log(
            "NIGHT ORDER STAFF PANEL AKTİF"
        );


    }catch(error){

        console.error(
            "PANEL HATASI:",
            error
        );


        document.getElementById(
            "orders"
        ).innerHTML =
            `
            <div class="error">

                Panel verileri yüklenemedi.

                <br><br>

                ${error.message}

            </div>
            `;

    }

}


/* =========================================================
   INITIAL AUTH CHECK
========================================================= */

(async function(){

    try{

        const {
            data,
            error
        } =
            await db.auth
                .getSession();


        if(error){

            throw error;

        }


        if(
            data &&
            data.session
        ){

            showApp();

            await startApp();

        }else{

            showLogin();

        }


    }catch(error){

        console.error(
            "AUTH BAŞLANGIÇ HATASI:",
            error
        );

        showLogin();

    }

})();

</script>
