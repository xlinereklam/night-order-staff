<!-- =========================================================
     SUPABASE JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   STATE
========================================================= */

let orders = [];

let orderItems = [];

let waiterRequests = [];

let refreshTimer = null;


/* =========================================================
   DOM
========================================================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const app =
    document.getElementById(
        "app"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =========================================================
   HELPERS
========================================================= */

function formatPrice(value){

    return Number(value || 0)
        .toLocaleString(
            "tr-TR",
            {
                style:"currency",
                currency:"TRY"
            }
        );

}


function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            "tr-TR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


function showLoginError(message){

    loginError.textContent =
        message;

    loginError.classList.remove(
        "hidden"
    );

}


function hideLoginError(){

    loginError.textContent =
        "";

    loginError.classList.add(
        "hidden"
    );

}


/* =========================================================
   AUTH UI
========================================================= */

function showApp(){

    loginScreen.classList.add(
        "hidden"
    );

    app.classList.remove(
        "hidden"
    );

}


function showLogin(){

    app.classList.add(
        "hidden"
    );

    loginScreen.classList.remove(
        "hidden"
    );

}


function stopRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

        refreshTimer =
            null;

    }

}


function startRefresh(){

    stopRefresh();

    refreshTimer =
        setInterval(
            async () => {

                const {
                    data
                } =
                    await supabase.auth
                        .getSession();


                if(
                    !data ||
                    !data.session
                ){

                    stopRefresh();

                    showLogin();

                    return;

                }


                try{

                    await Promise.all([
                        loadOrders(),
                        loadWaiterRequests()
                    ]);

                }catch(error){

                    console.error(
                        "Otomatik güncelleme hatası:",
                        error
                    );

                }

            },
            5000
        );

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        hideLoginError();

        loginButton.disabled =
            true;

        loginButton.textContent =
            "GİRİŞ YAPILIYOR...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        try{

            const {
                data,
                error
            } =
                await supabase.auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "Giriş yapılamadı."
                );

            }


            showApp();

            showToast(
                "Personel girişi başarılı."
            );


            await startApp();


        }catch(error){

            console.error(
                "GİRİŞ HATASI:",
                error
            );


            showLoginError(
                error.message ||
                "E-posta veya şifre hatalı."
            );


        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "GİRİŞ YAP";

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async () => {

        stopRefresh();


        const {
            error
        } =
            await supabase.auth
                .signOut();


        if(error){

            console.error(
                "ÇIKIŞ HATASI:",
                error
            );

            showToast(
                "Çıkış yapılamadı."
            );

            return;

        }


        orders = [];

        orderItems = [];

        waiterRequests = [];


        showLogin();


        document.getElementById(
            "password"
        ).value = "";


        showToast(
            "Oturum kapatıldı."
        );

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        console.log(
            "AUTH:",
            event
        );


        if(session){

            showApp();

        }else{

            stopRefresh();

            showLogin();

        }

    }
);


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    const {
        data,
        error
    } =
        await supabase
            .from("orders")
            .select(
                "id,table_id,status,payment_method,note,total,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(100);


    if(error){

        throw error;

    }


    orders =
        Array.isArray(data)
            ? data
            : [];


    await loadOrderItems();

}


/* =========================================================
   LOAD ORDER ITEMS
========================================================= */

async function loadOrderItems(){

    if(!orders.length){

        orderItems = [];

        renderOrders();

        return;

    }


    const ids =
        orders.map(
            order =>
                order.id
        );


    const {
        data,
        error
    } =
        await supabase
            .from("order_items")
            .select(
                "order_id,product_name,quantity,unit_price,total"
            )
            .in(
                "order_id",
                ids
            );


    if(error){

        throw error;

    }


    orderItems =
        Array.isArray(data)
            ? data
            : [];


    renderOrders();

}


/* =========================================================
   LOAD WAITER REQUESTS
========================================================= */

async function loadWaiterRequests(){

    const {
        data,
        error
    } =
        await supabase
            .from("service_requests")
            .select(
                "id,table_id,request_type,status,created_at"
            )
            .eq(
                "status",
                "pending"
            )
            .eq(
                "request_type",
                "waiter"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        throw error;

    }


    waiterRequests =
        Array.isArray(data)
            ? data
            : [];


    renderWaiterRequests();

}


/* =========================================================
   RENDER WAITER REQUESTS
========================================================= */

function renderWaiterRequests(){

    const list =
        document.getElementById(
            "waiterList"
        );


    const count =
        waiterRequests.length;


    document.getElementById(
        "waiterCount"
    ).textContent =
        count;


    document.getElementById(
        "waiterSectionCount"
    ).textContent =
        `${count} çağrı`;


    list.innerHTML = "";


    if(!count){

        list.innerHTML =
            `
            <div class="empty">
                Aktif garson çağrısı yok.
            </div>
            `;

        return;

    }


    waiterRequests.forEach(
        request => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "waiter-card";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "waiter-info";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "waiter-icon";

            icon.textContent =
                "♟";


            const text =
                document.createElement(
                    "div"
                );


            const table =
                document.createElement(
                    "div"
                );

            table.className =
                "table-number";

            table.textContent =
                `Masa ${request.table_id}`;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "request-time";

            time.textContent =
                `${formatTime(request.created_at)} • Garson bekleniyor`;


            text.appendChild(table);

            text.appendChild(time);


            info.appendChild(icon);

            info.appendChild(text);


            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "handle-button";

            button.textContent =
                "GÖRDÜM";


            button.addEventListener(
                "click",
                () => {

                    handleWaiterRequest(
                        request.id
                    );

                }
            );


            card.appendChild(info);

            card.appendChild(button);


            list.appendChild(card);

        }
    );

}


/* =========================================================
   HANDLE WAITER REQUEST
   SECURE RPC
========================================================= */

async function handleWaiterRequest(id){

    try{

        const {
            data,
            error
        } =
            await supabase
                .rpc(
                    "handle_waiter_request",
                    {
                        request_id:id
                    }
                );


        if(error){

            throw error;

        }


        console.log(
            "Garson çağrısı:",
            data
        );


        showToast(
            "Garson çağrısı kapatıldı."
        );


        await loadWaiterRequests();


    }catch(error){

        console.error(
            "GARSON ÇAĞRISI HATASI:",
            error
        );


        showToast(
            "Çağrı kapatılamadı."
        );

    }

}


/* =========================================================
   ORDER STATUS
========================================================= */

function statusText(status){

    switch(status){

        case "pending":
            return "Yeni";

        case "preparing":
            return "Hazırlanıyor";

        case "ready":
            return "Hazır";

        case "delivered":
            return "Teslim Edildi";

        case "completed":
            return "Tamamlandı";

        case "cancelled":
            return "İptal";

        default:
            return status || "Bilinmiyor";

    }

}


function statusClass(status){

    switch(status){

        case "pending":
            return "status-pending";

        case "preparing":
            return "status-preparing";

        case "ready":
            return "status-ready";

        case "delivered":
            return "status-delivered";

        case "cancelled":
            return "status-cancelled";

        default:
            return "status-pending";

    }

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(){

    const container =
        document.getElementById(
            "orders"
        );


    container.innerHTML = "";


    const newCount =
        orders.filter(
            order =>
                order.status === "pending"
        ).length;


    const preparingCount =
        orders.filter(
            order =>
                order.status === "preparing"
        ).length;


    document.getElementById(
        "newOrderCount"
    ).textContent =
        newCount;


    document.getElementById(
        "preparingCount"
    ).textContent =
        preparingCount;


    document.getElementById(
        "orderSectionCount"
    ).textContent =
        `${orders.length} sipariş`;


    if(!orders.length){

        container.innerHTML =
            `
            <div class="empty">
                Henüz sipariş yok.
            </div>
            `;

        return;

    }


    orders.forEach(
        order => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            if(
                order.status === "pending"
            ){

                card.classList.add(
                    "new"
                );

            }


            /* TOP */

            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "order-top";


            const tableBox =
                document.createElement(
                    "div"
                );


            const table =
                document.createElement(
                    "div"
                );

            table.className =
                "order-table";

            table.textContent =
                `Masa ${order.table_id}`;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "order-time";

            time.textContent =
                formatTime(
                    order.created_at
                );


            tableBox.appendChild(
                table
            );

            tableBox.appendChild(
                time
            );


            const status =
                document.createElement(
                    "div"
                );

            status.className =
                `status ${statusClass(order.status)}`;

            status.textContent =
                statusText(
                    order.status
                );


            top.appendChild(
                tableBox
            );

            top.appendChild(
                status
            );


            /* ITEMS */

            const itemsBox =
                document.createElement(
                    "div"
                );

            itemsBox.className =
                "order-items";


            const items =
                orderItems.filter(
                    item =>
                        String(
                            item.order_id
                        ) ===
                        String(
                            order.id
                        )
                );


            if(!items.length){

                const emptyItem =
                    document.createElement(
                        "div"
                    );

                emptyItem.className =
                    "order-item";

                emptyItem.textContent =
                    "Ürün bilgisi bulunamadı.";


                itemsBox.appendChild(
                    emptyItem
                );

            }else{

                items.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.className =
                            "order-item";


                        const name =
                            document.createElement(
                                "span"
                            );

                        name.className =
                            "order-item-name";

                        name.textContent =
                            item.product_name;


                        const qty =
                            document.createElement(
                                "span"
                            );

                        qty.className =
                            "order-item-qty";

                        qty.textContent =
                            `${item.quantity} × ${formatPrice(item.unit_price)}`;


                        row.appendChild(
                            name
                        );

                        row.appendChild(
                            qty
                        );


                        itemsBox.appendChild(
                            row
                        );

                    }
                );

            }


            /* BOTTOM */

            const bottom =
                document.createElement(
                    "div"
                );

            bottom.className =
                "order-bottom";


            const payment =
                document.createElement(
                    "div"
                );

            payment.className =
                "payment";

            payment.textContent =
                `Ödeme: ${order.payment_method || "-"}`;


            const total =
                document.createElement(
                    "div"
                );

            total.className =
                "total";

            total.textContent =
                formatPrice(
                    order.total
                );


            bottom.appendChild(
                payment
            );

            bottom.appendChild(
                total
            );


            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "order-actions";


            if(
                order.status === "pending"
            ){

                actions.appendChild(
                    createActionButton(
                        "Hazırlanıyor",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "preparing"
                            )
                    )
                );

            }


            if(
                order.status === "preparing"
            ){

                actions.appendChild(
                    createActionButton(
                        "Hazır",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "ready"
                            )
                    )
                );

            }


            if(
                order.status === "ready"
            ){

                actions.appendChild(
                    createActionButton(
                        "Teslim Edildi",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "delivered"
                            )
                    )
                );

            }


            if(
                order.status !== "delivered" &&
                order.status !== "cancelled" &&
                order.status !== "completed"
            ){

                actions.appendChild(
                    createActionButton(
                        "İptal",
                        () =>
                            updateOrderStatus(
                                order.id,
                                "cancelled"
                            )
                    )
                );

            }


            card.appendChild(
                top
            );

            card.appendChild(
                itemsBox
            );

            card.appendChild(
                bottom
            );

            card.appendChild(
                actions
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ACTION BUTTON
========================================================= */

function createActionButton(
    text,
    action
){

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "action-button";


    button.textContent =
        text;


    button.addEventListener(
        "click",
        action
    );


    return button;

}


/* =========================================================
   UPDATE ORDER STATUS
   AUTHENTICATED REQUEST
========================================================= */

async function updateOrderStatus(
    orderId,
    status
){

    try{

        const {
            error
        } =
            await supabase
                .from("orders")
                .update({
                    status:status
                })
                .eq(
                    "id",
                    orderId
                );


        if(error){

            throw error;

        }


        showToast(
            `Sipariş: ${statusText(status)}`
        );


        await loadOrders();


    }catch(error){

        console.error(
            "SİPARİŞ DURUMU HATASI:",
            error
        );


        showToast(
            "Sipariş durumu değiştirilemedi."
        );

    }

}


/* =========================================================
   START APP
========================================================= */

async function startApp(){

    try{

        const {
            data,
            error
        } =
            await supabase.auth
                .getSession();


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.session
        ){

            showLogin();

            return;

        }


        await Promise.all([
            loadOrders(),
            loadWaiterRequests()
        ]);


        startRefresh();


        console.log(
            "NIGHT ORDER STAFF PANEL AKTİF"
        );


    }catch(error){

        console.error(
            "PANEL HATASI:",
            error
        );


        document.getElementById(
            "orders"
        ).innerHTML =
            `
            <div class="error">

                Panel verileri yüklenemedi.

                <br><br>

                ${error.message}

            </div>
            `;

    }

}


/* =========================================================
   INITIAL AUTH CHECK
========================================================= */

(async function(){

    try{

        const {
            data,
            error
        } =
            await supabase.auth
                .getSession();


        if(error){

            throw error;

        }


        if(
            data &&
            data.session
        ){

            showApp();

            await startApp();

        }else{

            showLogin();

        }


    }catch(error){

        console.error(
            "AUTH BAŞLANGIÇ HATASI:",
            error
        );

        showLogin();

    }

})();

</script>
